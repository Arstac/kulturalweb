{% load static cms_tags sekizai_tags %}

<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="laKultural, asociación productora de música y organizadora de eventos musicales">
  <title>la Kultural</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.ico' %}" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900|Open+Sans:400,400i,700,900"
    rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Font Awesome (versión moderna con JS) -->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

  <!-- CSS personalizado -->
  <link href="{% static 'css/base.css' %}" rel="stylesheet" />
  <link href="{% static 'css/navbar.css' %}" rel="stylesheet" />
  <link href="{% static 'usuarios/css/login_logout.css' %}" rel="stylesheet" />
  <link href="{% static 'eventos/css/evento.css' %}" rel="stylesheet" />
  <link href="{% static 'musica/css/musica.css' %}" rel="stylesheet" />
  <link href="{% static 'musica/css/player.css' %}" rel="stylesheet" />
  <link href="{% static 'tienda/css/producto.css' %}" rel="stylesheet" />
  <link href="{% static 'carrito/css/carrito.css' %}" rel="stylesheet" />
  <link href="{% static 'core/css/core.css' %}" rel="stylesheet" />

  {% render_block "css" %}
</head>

<body class="w-100 text-center text-bg-dark mx-auto flex-column">
  {% cms_toolbar %}

  <!-- Navbar -->
  {% include 'navbar.html' %}

  <!-- Contenido dinámico -->
  {% block content %}{% endblock %}

  <!-- Footer -->
  {% include 'footer.html' %}

  <!-- Bootstrap JS (bundle incluye Popper.js) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- JS global -->
  <script src="{% static 'js/scripts.js' %}"></script>

  <!-- JS específico por vista -->
  {% block scripts %}{% endblock %}

  {% render_block "js" %}

</body>

</html>
