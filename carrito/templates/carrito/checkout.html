{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="checkout-section py-5" style="background-color: #111; color: #48F783;">
  <div class="container text-center">
    <h1 class="display-4 text-success mb-4">Checkout</h1>

    <div class="card mx-auto shadow-lg p-4" style="max-width: 500px; background-color: #1c1c1c;">
      <h2 class="text-white mb-3">Total a pagar: <strong>{{ total }}€</strong></h2>
      <div class="paypal-button-wrapper d-flex justify-content-center">
        {{ form.render }}
      </div>
    </div>
  </div>
</section>
{% endblock %}
