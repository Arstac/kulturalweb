<div class="hero-section position-relative d-flex align-items-center justify-content-center text-center text-white"
    style="background-image: url('{{ instance.background_image.url }}'); background-size: cover; background-position: center; min-height: 80vh;">

    <!-- Overlay oscurecedor para leer mejor el texto -->
    <div class="position-absolute top-0 start-0 w-100 h-100" style="background-color: rgba(0,0,0,0.6);"></div>

    <div class="position-relative container z-2">
        {% if instance.logo_image %}
        <img src="{{ instance.logo_image.url }}" alt="{{ instance.title|default:'Hero Logo' }}" class="img-fluid mb-4"
            style="max-width: 80%; max-height: 200px;">
        {% elif instance.title %}
        <h1 class="display-2 fw-bold mb-3 text-uppercase" style="letter-spacing: 2px;">{{ instance.title }}</h1>
        {% endif %}

        {% if instance.subtitle %}
        <p class="lead mb-5 fs-3 fw-light">{{ instance.subtitle }}</p>
        {% endif %}

        {% if instance.button_text %}
        <a href="{% if instance.internal_page %}{{ instance.internal_page.get_absolute_url }}{% else %}{{ instance.button_url }}{% endif %}"
            class="btn btn-outline-light btn-lg px-5 py-3 rounded-pill fw-bold text-uppercase"
            style="border-width: 2px;">
            {{ instance.button_text }}
        </a>
        {% endif %}
    </div>
</div>
